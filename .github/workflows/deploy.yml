
name: Fullstack CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /home/ubuntu/Qualwebs_training_program
          git pull origin main

      - name: Build frontend
        run: |
          cd /home/ubuntu/Qualwebs_training_program/docker-aws-deployment/frontend
          npm ci
          npm run build

      - name: Copy frontend build
        run: |
          cd /home/ubuntu/Qualwebs_training_program/docker-aws-deployment
          cp -r frontend/dist/. backend/public/

      - name: Install backend dependencies
        run: |
          cd /home/ubuntu/Qualwebs_training_program/docker-aws-deployment/backend
          npm ci

      - name: Restart backend
        run: |
          pm2 restart fullstack-app
